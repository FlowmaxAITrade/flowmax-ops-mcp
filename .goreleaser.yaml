version: 2

builds:
  - id: flowmax-ops-mcp
    main: ./cmd/flowmax-ops-mcp
    binary: flowmax-ops-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/FlowmaxAITrade/flowmax-ops-mcp/internal/version.Version={{ .Version }}
      - -X github.com/FlowmaxAITrade/flowmax-ops-mcp/internal/version.Commit={{ .Commit }}
      - -X github.com/FlowmaxAITrade/flowmax-ops-mcp/internal/version.BuildDate={{ .Date }}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
