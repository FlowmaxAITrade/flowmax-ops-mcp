name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # 用 PAT 代替 GITHUB_TOKEN，绕过 org 对「Actions 创建 PR」的限制
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        # 配置在 .release-please-config.json（release-type: go + initial-version 0.1.0）
