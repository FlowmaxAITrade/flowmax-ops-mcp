name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 用 GitHub App 生成短期 token（最小权限、自动过期），代替 GITHUB_TOKEN 创建 PR
      - uses: tibdex/github-app-token@v2
        id: app-token
        with:
          app_id: ${{ secrets.RELEASE_APP_ID }}
          private_key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
        # 配置在 .release-please-config.json（release-type: go + initial-version 0.1.0）
